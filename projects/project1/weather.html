<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <nav>
        <h1>Weather App</h1>
        <div class="icon">
            <!-- <div  id="sun">
                <img src="https://static-00.iconduck.com/assets.00/white-sun-with-rays-emoji-512x512-d2ia3vdv.png" alt="sun img">
            </div> -->
            <div id="moon">
                <img src="https://static-00.iconduck.com/assets.00/crescent-moon-emoji-512x512-923xcoy4.png" alt="moon img">
        </div>
        </ul>
    </nav>
    <div class="cont">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false" >
            <button><img src="winter-of-code\projects\project1\winter-of-code\projects\project1\search.svg"></button>
        </div>
         <div class="weather">
            <img src="winter-of-code\projects\project1\winter-of-code\projects\project1\rain.svg" class="w_icon" height="100px" width="200px">
            <h1 class="temp">22°c</h1>
            <h2 class="city">Secunderabad</h2>
            <div class="detail">
                <div class="col">
                    <img src="winter-of-code\humidity.svg">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="winter-of-code\wind-svgrepo-com.svg" >
                    <div>
                        <p class="wind">100 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
         </div>
    </div>
    <script src="weather.js"></script>

</html>
